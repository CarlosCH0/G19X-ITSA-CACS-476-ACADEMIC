# Sistema HiPo para identificar talento de alto potencial.
# PluriOne S.A. de C.V. - Develop Talent & Technology.

services:
  db:
    image: postgres:16-alpine
    container_name: hipo_db
    environment:
      POSTGRES_DB: talento
      POSTGRES_USER: talento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talento -d talento"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: hipo_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://talento:${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}@db:5432/talento
      SECRET_KEY: ${SECRET_KEY:?Configura SECRET_KEY en .env}
      ENTORNO: produccion
      SEED_DEMO_DATA: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configura ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      # Azure OpenAI (opcional; sin credenciales se usa el modo local)
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: hipo_frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  datos_postgres:
